# 共享商品图片的 PV / PVC
# 仓库内路径：tea-yaml/pv-pvc-image.yaml
#
# 商品图片由 attach-server 上传、tea-admin 读写，都在 /home/images/vm。
# 前端 nginx 用同一个 PVC 把图片当静态资源发出去。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-image
spec:
  volumeMode: Filesystem
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 172.18.176.252
    path: /home/images/vm/

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
