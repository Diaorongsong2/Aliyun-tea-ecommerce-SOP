# 商品管理页面（admin-page）静态资源的 PV / PVC
# 仓库内路径：tea-yaml/pv-pvc-adminpage.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: admin-page
spec:
  volumeMode: Filesystem
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 172.18.176.252
    path: /project/page/admin-page/dist/

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: admin-page
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
