# 商品展示服务 tea-server（端口 30091）
# 仓库内路径：tea-yaml/teaserver-jar.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teaserver-jar
spec:
  selector:
    matchLabels:
      app: teaserver-jar
  replicas: 1
  template:
    metadata:
      labels:
        app: teaserver-jar
    spec:
      volumes:
        - name: teaserver-jar
          persistentVolumeClaim:
            claimName: pvc-jar
      containers:
        - name: teaserver-jar
          image: harbor:443/tea/jar:base
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: timezone
                  key: timezone
          command: ["/bin/bash"]
          args:
            - -c
            - |
              java -Dfile.encoding=utf-8 -jar /project/jar/tea-server-admin-1.0.0-SNAPSHOT.jar \
              -Xmx128M -Xms128M -Xmn64m -XX:MaxMetaspaceSize=128M -XX:MetaspaceSize=128M \
              --server.port=30091 --spring.profiles.active=vm
          ports:
            - protocol: TCP
              containerPort: 30091
          volumeMounts:
            - name: teaserver-jar
              mountPath: /project/jar
      restartPolicy: Always
