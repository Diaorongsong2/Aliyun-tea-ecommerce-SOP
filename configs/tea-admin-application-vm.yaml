# 商品管理服务 tea-admin —— 应用配置（profile: vm）
# 仓库内路径：tea-admin/tea-admin-main/src/main/resources/application-vm.yaml
spring:
  # 数据源
  datasource:
    url: jdbc:mysql://<RDS-MySQL-内网地址>:3306/tarena_tp_tea?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: teauser
    password: <YOUR_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 1
      auto-commit: true
      idle-timeout: 600000
      minimum: 5
      max-lifetime: 1800000
      connection-timeout: 120000
      connection-test-query: SELECT 1 FROM DUAL
  # 缓存
  redis:
    host: <云Redis-内网地址>
    port: 6379
    password: "<YOUR_PASSWORD>"
    database: 8
    jedis:
      pool:
        max-active: 8
        min-idle: 5
        max-idle: 8
        max-wait: PT15M
        time-between-eviction-runs: PT15M

# 图片附件：容器内是从 NFS 挂进来的目录，对外前缀走 SLB
image_path: /home/images/vm/tea_attach/
url: http://<SLB-公网IP>:30080/tea_attach/

# 消息队列
rocketmq:
  name-server: 172.18.176.14:9876
  producer:
    group: ${spring.application.name}

mq:
  topic:
    order-cancel-topic: order-cancel-topic

business-mq:
  topic:
    stock-rollback: 'order-cancel-topic'
  group:
    rollback-listener-group: 'stock-rollback-listener-group'
